name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'

jobs:
  # ── 1. 前端构建 ──────────────────────────────────────────
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  # ── 2. Go 后端构建（含嵌入前端） ────────────────────
  build-go:
    runs-on: ubuntu-latest
    needs: build-web

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - name: 复制前端到 embed 目录
        run: |
          mkdir -p cmd/tun-console/dist
          cp -r web/dist/* cmd/tun-console/dist/

      - name: 构建 Go 二进制
        run: |
          CGO_ENABLED=0 go build -tags embed -v -o build/tun-console ./cmd/tun-console/

      - name: 上传 Go 二进制产物
        uses: actions/upload-artifact@v4
        with:
          name: tun-console-binary
          path: build/tun-console
          retention-days: 1

  # ── 3. Docker 镜像构建与推送 ──────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: build-web
    # 只在主分支推送时构建 Docker 镜像
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. 发布 Release（可选，打 tag 时触发） ────────
  release:
    runs-on: ubuntu-latest
    needs: [build-go, docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 下载 Go 二进制产物
        uses: actions/download-artifact@v4
        with:
          name: tun-console-binary
          path: build/

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/tun-console
          generate_release_notes: true
