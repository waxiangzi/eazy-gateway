name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'

jobs:
  # ── 1. 前端构建 ──────────────────────────────────────────
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  # ── 2. 交叉编译（x86_64 + arm64） ────────────────────
  build-go:
    runs-on: ubuntu-latest
    needs: build-web

    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - name: 复制前端到 embed 目录
        run: |
          mkdir -p cmd/eazy-gateway/dist
          cp -r web/dist/* cmd/eazy-gateway/dist/

      - name: 构建 Go 二进制 (${{ matrix.arch }})
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -tags embed -v -o build/eazy-gateway-${{ matrix.arch }} ./cmd/eazy-gateway/

      - name: 上传二进制产物 (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: eazy-gateway-${{ matrix.arch }}
          path: build/eazy-gateway-${{ matrix.arch }}
          retention-days: 1

  # ── 3. 发布 Release（打 tag 时触发） ────────────────
  release:
    runs-on: ubuntu-latest
    needs: build-go
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 下载 x86_64 二进制
        uses: actions/download-artifact@v4
        with:
          name: eazy-gateway-amd64
          path: release/

      - name: 下载 arm64 二进制
        uses: actions/download-artifact@v4
        with:
          name: eazy-gateway-arm64
          path: release/

      - name: 重命名二进制文件
        run: |
          mv release/eazy-gateway-amd64 release/eazy-gateway-linux-amd64
          mv release/eazy-gateway-arm64 release/eazy-gateway-linux-arm64
          chmod +x release/*

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/eazy-gateway-linux-amd64
            release/eazy-gateway-linux-arm64
          generate_release_notes: true
